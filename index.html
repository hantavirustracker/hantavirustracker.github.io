<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://hantavirustracker.github.io/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HantavirusTracker is a live global hantavirus outbreak dashboard with map intelligence, infection spread timeline, latest verified news, and 30-minute automated updates."
    />
    <meta
      name="keywords"
      content="hantavirus tracker, hantavirus outbreak map, hantavirus cases timeline, global outbreak dashboard, epidemiology surveillance"
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="author" content="HantavirusTracker" />
    <meta name="theme-color" content="#04120c" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hantavirustracker.github.io/" />
    <meta property="og:title" content="HantavirusTracker | Live Global Outbreak Matrix" />
    <meta
      property="og:description"
      content="Real-source hantavirus outbreak monitoring with timeline of infections and spread, latest news, map intelligence, and automated 30-minute updates."
    />
    <meta property="og:image" content="https://hantavirustracker.github.io/favicon.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HantavirusTracker | Live Global Outbreak Matrix" />
    <meta
      name="twitter:description"
      content="Live hantavirus infection timeline, spread analytics, and latest global outbreak reports."
    />
    <meta name="twitter:image" content="https://hantavirustracker.github.io/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "HantavirusTracker",
            "url": "https://hantavirustracker.github.io/",
            "description": "Global hantavirus outbreak monitoring dashboard with map, timeline, and latest reports.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://hantavirustracker.github.io/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Dataset",
            "name": "HantavirusTracker Live Outbreak Dataset",
            "description": "Continuously updated hantavirus report dataset built from real public report feeds.",
            "url": "https://hantavirustracker.github.io/data.json",
            "license": "https://creativecommons.org/licenses/by/4.0/",
            "isAccessibleForFree": true,
            "creator": {
              "@type": "Organization",
              "name": "HantavirusTracker"
            }
          }
        ]
      }
    </script>

    <title>HantavirusTracker | Live Global Outbreak Matrix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
