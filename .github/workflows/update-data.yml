name: Update Live Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Refresh public data
        run: python automation/update_data.py --once --push
        env:
          GIT_USER_NAME: HantavirusTracker Bot
          GIT_USER_EMAIL: bot@hantavirustracker.github.io
